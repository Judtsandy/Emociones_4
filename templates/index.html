<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento de Emociones</title>
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            color: #FFB6C1; /* Color rosa pastel para todo el texto */
            font-family: 'Arial', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 2rem;
            background-image: url('https://wallpapers.com/images/hd/purple-and-blue-background-1920-x-1200-7nphp2wp5rjjkrwg.jpg'); /* Aquí puedes poner la URL de tu imagen de fondo */
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }

        .app-container {
            background: rgba(0, 0, 0, 0.7); /* Contenedor negro translúcido */
            border-radius: 20px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            padding: 2rem;
            width: 100%;
            max-width: 1200px;
            margin: 0 auto;
            backdrop-filter: blur(10px); /* Efecto de desenfoque para mayor profundidad */
        }

        .content-wrapper {
            display: grid;
            gap: 2rem;
            padding: 1rem;
        }

        .section {
            background: rgba(0, 0, 0, 0.5); /* Secciones también translúcidas */
            border-radius: 15px;
            padding: 1.5rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 182, 193, 0.2); /* Borde sutil en rosa pastel */
        }

        h1, h2 {
            color: #FFB6C1; /* Rosa pastel para títulos */
            text-shadow: 0 0 10px rgba(255, 182, 193, 0.5);
            margin-bottom: 1.5rem;
        }

        h1 {
            font-size: 2.5rem;
            text-align: center;
            padding-bottom: 1rem;
            border-bottom: 2px solid #FFB6C1;
            margin-bottom: 2rem;
        }

        h2 {
            font-size: 1.8rem;
        }

        .upload-section {
            text-align: center;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            align-items: center;
        }

        input[type="file"] {
            background-color: rgba(0, 0, 0, 0.6);
            border: 2px solid #FFB6C1;
            color: #FFB6C1;
            padding: 0.8rem;
            border-radius: 8px;
            width: 100%;
            max-width: 300px;
        }

        button {
            background: linear-gradient(145deg, #FFB6C1, #FFC0CB);
            color: #000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 8px;
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(255, 182, 193, 0.3);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(255, 182, 193, 0.4);
            background: linear-gradient(145deg, #FFC0CB, #FFB6C1);
        }

        .image-container {
            max-width: 400px;
            margin: 0 auto;
        }

        #originalImage {
            width: 100%;
            height: auto;
            border: 3px solid #FFB6C1;
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(255, 182, 193, 0.3);
        }

        .image-gallery {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 1rem;
            margin-top: 1rem;
        }

        .image-gallery img {
            width: 100%;
            height: 150px;
            object-fit: cover;
            border-radius: 8px;
            border: 2px solid #FFB6C1;
            transition: transform 0.3s ease;
        }

        .image-gallery img:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(255, 182, 193, 0.5);
        }

        @media (max-width: 768px) {
            .app-container {
                padding: 1rem;
            }

            h1 {
                font-size: 2rem;
            }

            h2 {
                font-size: 1.5rem;
            }
        }
    </style>
</head>
<body>
    <div class="app-container">
        <h1>Reconocimiento de Emociones</h1>
        
        <div class="content-wrapper">
            <div class="section upload-section">
                <h2>Imagen a Analizar</h2>
                <form id="uploadForm" enctype="multipart/form-data">
                    <input type="file" id="image" name="image" accept="image/*">
                    <button type="submit">Subir imagen</button>
                </form>
            </div>

            <div class="section original-image-section">
                <h2>Imagen Original</h2>
                <div class="image-container">
                    <img id="originalImage" src="" alt="Imagen Original">
                </div>
            </div>

            <div class="section processed-images-section">
                <h2>Imágenes Procesadas</h2>
                <div id="processedImages" class="image-gallery"></div>
            </div>

            <div class="section historico-images-section">
                <h2>Historial</h2>
                <div id="historicoImages" class="image-gallery"></div>
            </div>
        </div>
    </div>
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
