<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reconocimiento Facial</title>
    <!-- Enlace al archivo CSS -->
    <!-- <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}" -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        /* Estilos generales */
        body {
            background-color: #000; /* Fondo negro */
            color: white;
            font-family: 'Roboto', sans-serif; /* Tipografía moderna */
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            text-align: center;
        }

        /* Contenedor principal */
        .container {
            background-color: #1e1e1e; /* Fondo gris oscuro para el recuadro */
            border: 2px solid #9b4dff; /* Borde luminoso */
            border-radius: 10px;
            padding: 20px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 0 20px #9b4dff; /* Sombra luminosa */
        }

        /* Sección de subir imagen */
        .upload-section {
            margin-bottom: 20px;
        }

        /* Encabezados */
        h1, h2 {
            color: #9b4dff;
            font-size: 1.8em;
            text-shadow: 0 0 10px #9b4dff, 0 0 20px #9b4dff;
            margin-bottom: 15px;
        }

        /* Botones e inputs */
        input[type="file"], button {
            font-family: 'Roboto', sans-serif;
            font-size: 1em;
            border-radius: 5px;
            padding: 10px;
        }

        input[type="file"] {
            background-color: #2e2e2e;
            border: 2px solid #9b4dff;
            color: white;
            margin-bottom: 10px;
        }

        button {
            background-color: #9b4dff;
            border: none;
            color: white;
            cursor: pointer;
            transition: background-color 0.3s;
            text-shadow: 0 0 10px #ff00ff, 0 0 20px #ff00ff;
        }

        button:hover {
            background-color: #7a3aee;
        }

        /* Contenedor de imágenes */
        .image-container {
            margin: 15px auto;
        }

        .image-container img {
            width: 100%;
            max-width: 400px;
            border: 5px solid #9b4dff;
            box-shadow: 0 0 15px #9b4dff;
            border-radius: 10px;
        }

        /* Resultado de emoción */
        #emotionResult {
            font-size: 1.2em;
            margin-top: 10px;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Sección de subir imagen -->
        <div class="upload-section">
            <h1>Sube una imagen para analizarla</h1>
            <form id="uploadForm" enctype="multipart/form-data">
                <input type="file" id="image" name="image" accept="image/*">
                <button type="submit">Subir imagen</button>
            </form>
        </div>

        <!-- Sección de imagen original -->
        <div class="original-image-section">
            <h2>Imagen original</h2>
            <div class="image-container">
                <img id="originalImage" src="" alt="Imagen Original">
            </div>
        </div>

        <!-- Sección de imagen procesada con emoción detectada -->
        <div class="processed-image-section">
            <h2>Resultado</h2>
            <div class="image-container">
                <img id="processedImage" src="" alt="Imagen Procesada">
            </div>
            <p id="emotionResult">Emoción detectada: <span>-</span></p>
        </div>
    </div>

    <!-- Enlace al archivo JS -->
    <script src="{{ url_for('static', filename='js/script.js') }}"></script>
</body>
</html>
